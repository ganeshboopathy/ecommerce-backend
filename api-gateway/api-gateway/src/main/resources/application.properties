# ===============================
# Application Info
# ===============================
spring.application.name=API-GATEWAY
server.port=8000

# ===============================
# Eureka Client
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================
# Gateway Discovery
# ===============================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=hero-service
spring.cloud.gateway.routes[0].uri=lb://hero-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/hero/**

spring.cloud.gateway.routes[1].id=product-service-api
spring.cloud.gateway.routes[1].uri=lb://product-service-api
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**

spring.cloud.gateway.routes[2].id=sales-analytics-service
spring.cloud.gateway.routes[2].uri=lb://sales-analytics-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/analytics/**

spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://order-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/orders/**



# ===============================
# Logging
# ===============================
logging.level.org.springframework.cloud.gateway=DEBUG
